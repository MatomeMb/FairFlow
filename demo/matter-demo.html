<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Test matter:// URIs and Lens overlay - .things that Matter" />
    <title>Matter Demo - .things that Matter</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles/design-system.css" />
    <link rel="stylesheet" href="styles/components.css" />
  </head>
  <body class="layout">
    <a href="#main" class="skiplink">Skip to main content</a>
    <header class="header" role="banner">
      <a href="index.html" class="header__brand-link">.things that Matter</a>
      <span class="header__tagline">Matter Demo</span>
    </header>
    <main id="main" class="layout__main layout__main--narrow" role="main">
      <div class="card">
        <h1 class="card__title">Matter Demo</h1>
        <p class="card__subtitle">Paste a <code>matter://</code> URI below, then click the link to trigger the Lens overlay.</p>

        <div class="form-group">
          <label for="uri" class="form-group__label">Matter URI</label>
          <input type="text" id="uri" class="form-group__input" placeholder="matter://&lt;hash&gt;" value="matter://bfefe5574ca167f98378ef37a123ed07bf00f6bd622c2283e19ac3fbd598ba96" aria-describedby="uriHint" />
          <p id="uriHint" class="form-group__hint">Uses Shadow Index at http://localhost:3000. Install the Lens extension to see the overlay.</p>
        </div>

        <p>Link: <a href="#" id="link" class="uri-list__link">Click here</a></p>
      </div>
    </main>
    <footer class="footer" role="contentinfo">Copyright 2026 .things that Matter</footer>

    <script>
      (function () {
        const input = document.getElementById('uri');
        const link = document.getElementById('link');
        function update() {
          const v = (input.value || '').trim();
          link.href = v.startsWith('matter://') ? v : 'matter://' + v;
          link.textContent = link.href;
        }
        input.addEventListener('input', update);
        update();
      })();
    </script>
  </body>
</html>
