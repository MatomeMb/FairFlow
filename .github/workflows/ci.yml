# CI: type-check, lint, test for shadow-index (lead package)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  shadow-index:
    name: shadow-index
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcj/packages/shadow-index

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcj/packages/shadow-index/package-lock.json

      - name: Install dependencies
        run: npm ci 2>/dev/null || npm install

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run
