# CI: type-check, lint, test for shadow-index and auth-portal
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  shadow-index:
    name: shadow-index
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shadow-index

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/shadow-index/package-lock.json

      - name: Install dependencies
        run: npm ci 2>/dev/null || npm install

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run

  auth-portal-quality:
    name: auth-portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/auth-portal

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/auth-portal/package-lock.json

      - name: Install dependencies
        run: npm ci 2>/dev/null || npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
