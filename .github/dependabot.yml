version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/shadow-index
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /packages/auth-portal
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
  - package-ecosystem: cargo
    directory: /packages/matter-core
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
