name: Bug report
description: Report a defect in Fairflow
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **Do not include secrets or personal data.**
        For vulnerabilities, use private reporting — see SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear description of the problem
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start API…
        2. Call endpoint…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Node version, package (shadow-index / auth-portal)"
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste redacted logs only
